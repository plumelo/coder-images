name: CI

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  check-base:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build base image
        run: docker build -t test-base ./images/base

      - name: Verify base image tools
        run: |
          docker run --rm test-base ssh-to-age --help
          docker run --rm test-base sops --version
          docker run --rm test-base age --version

  check-devops:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build devops image
        run: docker build ./images/devops
